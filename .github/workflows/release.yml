name: Release

# Push a vX.Y.Z tag on a commit that is already on the default branch:
#   git tag v1.2.3 && git push origin v1.2.3
# The release notes come from the matching CHANGELOG.md section, and the major tag
# (v1) is moved to the same commit so `@v1` consumers pick up the release.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  lint:
    permissions:
      contents: read
    uses: $/.github/workflows/lint.yml

  self-test:
    # The docs self-test calls docs.yml, whose deploy job needs these even when it is skipped.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: $/.github/workflows/self-test.yml

  release:
    name: Publish ${{ github.ref_name }}
    needs: [lint, self-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: ./scripts/Publish-Release.ps1 -Tag $env:TAG -DefaultBranch $env:DEFAULT_BRANCH
