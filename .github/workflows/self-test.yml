name: Self-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions: {}

concurrency:
  group: self-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pester:
    name: Pester (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Pester
        shell: pwsh
        run: ./scripts/Invoke-Tests.ps1

  actions:
    name: Actions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: debug
        uses: $/actions/debug

      - name: context
        id: context
        uses: $/actions/context

      - name: version (tag)
        id: tag
        uses: $/actions/version

      - name: version (run-number)
        id: run-number
        uses: $/actions/version
        with:
          strategy: run-number
          base-version: '1.0'

      # A tag build of this repository would not match the fixture version.
      - name: version (manifest)
        id: manifest
        if: github.ref_type != 'tag'
        uses: $/actions/version
        with:
          strategy: manifest
          working-directory: tests/fixtures/npm-lib

      - name: assert-tag-version
        id: assert
        uses: $/actions/assert-tag-version
        with:
          tag: v2.3.4
          manifest: tests/fixtures/npm-lib/package.json

      - name: Check outputs
        shell: pwsh
        env:
          CONTEXT_IMAGE: ${{ steps.context.outputs.image }}
          CONTEXT_SHORT_SHA: ${{ steps.context.outputs.short-sha }}
          CONTEXT_SHOULD_PUBLISH: ${{ steps.context.outputs.should-publish }}
          CONTEXT_IS_PULL_REQUEST: ${{ steps.context.outputs.is-pull-request }}
          TAG_VERSION: ${{ steps.tag.outputs.version }}
          RUN_NUMBER_VERSION: ${{ steps.run-number.outputs.version }}
          MANIFEST_VERSION: ${{ steps.manifest.outputs.version }}
          ASSERT_CHECKED: ${{ steps.assert.outputs.checked }}
          EXPECTED_IMAGE: ghcr.io/${{ github.repository }}
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: ./scripts/Test-ActionOutputs.ps1

  docs-template:
    name: Docs (template)
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: $/.github/workflows/docs.yml
    with:
      source: tests/fixtures/docusaurus
      deploy: false
      artifact-name: docs-template

  docs-node:
    name: Docs (node)
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: $/.github/workflows/docs.yml
    with:
      source: tests/fixtures/docs-node
      builder: node
      deploy: false
      artifact-name: docs-node

  docs-check:
    name: Docs artifacts
    needs: [docs-template, docs-node]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: docs-*
          path: artifacts

      - name: Check the sites
        shell: pwsh
        run: ./scripts/Test-DocsArtifacts.ps1

  node-ci:
    name: Node CI
    permissions:
      contents: read
    uses: $/.github/workflows/node-ci.yml
    with:
      working-directory: tests/fixtures/node-app
      os: '["ubuntu-latest", "windows-latest"]'
      scripts: lint test
      test-results: test-results/junit.xml
      coverage-reports: coverage/lcov.info
      minimum-coverage: '50'
      check-clean: true
      artifacts: |
        tests/fixtures/node-app/test-results/junit.xml
        tests/fixtures/node-app/coverage/lcov.info
      artifact-name: ci-node

  pwsh-ci:
    name: PowerShell CI
    permissions:
      contents: read
    uses: $/.github/workflows/pwsh-ci.yml
    with:
      os: '["ubuntu-latest", "windows-latest"]'
      paths: tests/fixtures/pwsh-module
      analyzer: true
      analyzer-settings: PSScriptAnalyzerSettings.psd1
      tests: tests/fixtures/pwsh-module/tests
      coverage: tests/fixtures/pwsh-module/Fixture.Module.psm1
      minimum-coverage: '80'
      artifact-name: ci-pester

  # The fixture's version cannot match a tag of this repository.
  npm-package:
    name: npm package
    if: github.ref_type != 'tag'
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: $/.github/workflows/npm-package.yml
    with:
      working-directory: tests/fixtures/npm-lib
      publish: false
      github-release: false
      artifact-name: ci-npm-package

  ci-check:
    name: CI artifacts
    needs: [node-ci, pwsh-ci, npm-package]
    if: ${{ !cancelled() && needs.node-ci.result == 'success' && needs.pwsh-ci.result == 'success' && needs.npm-package.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-*
          path: artifacts

      - name: Check the artifacts
        shell: pwsh
        env:
          EXPECT_PACKAGE: ${{ needs.npm-package.result == 'success' }}
        run: ./scripts/Test-CiArtifacts.ps1 -ExpectPackage:($env:EXPECT_PACKAGE -eq 'true')
