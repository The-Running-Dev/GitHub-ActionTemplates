name: Self-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions: {}

concurrency:
  group: self-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pester:
    name: Pester (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Pester
        shell: pwsh
        run: |
          $pester = Get-Module -ListAvailable Pester | Where-Object Version -ge '5.5.0'
          if (-not $pester) { Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck }
          Import-Module Pester -MinimumVersion 5.5.0

          $configuration = New-PesterConfiguration
          $configuration.Run.Path = 'tests'
          $configuration.Run.Exit = $true
          $configuration.Output.Verbosity = 'Detailed'
          $configuration.Output.CIFormat = 'GithubActions'
          Invoke-Pester -Configuration $configuration

  actions:
    name: Actions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: debug
        uses: $/actions/debug

      - name: context
        id: context
        uses: $/actions/context

      - name: version (tag)
        id: tag
        uses: $/actions/version

      - name: version (run-number)
        id: run-number
        uses: $/actions/version
        with:
          strategy: run-number
          base-version: '1.0'

      # A tag build of this repository would not match the fixture version.
      - name: version (manifest)
        id: manifest
        if: github.ref_type != 'tag'
        uses: $/actions/version
        with:
          strategy: manifest
          working-directory: tests/fixtures/npm-lib

      - name: assert-tag-version
        id: assert
        uses: $/actions/assert-tag-version
        with:
          tag: v2.3.4
          manifest: tests/fixtures/npm-lib/package.json

      - name: Check outputs
        shell: pwsh
        env:
          CONTEXT_IMAGE: ${{ steps.context.outputs.image }}
          CONTEXT_SHORT_SHA: ${{ steps.context.outputs.short-sha }}
          CONTEXT_SHOULD_PUBLISH: ${{ steps.context.outputs.should-publish }}
          CONTEXT_IS_PULL_REQUEST: ${{ steps.context.outputs.is-pull-request }}
          TAG_VERSION: ${{ steps.tag.outputs.version }}
          RUN_NUMBER_VERSION: ${{ steps.run-number.outputs.version }}
          MANIFEST_VERSION: ${{ steps.manifest.outputs.version }}
          ASSERT_CHECKED: ${{ steps.assert.outputs.checked }}
          EXPECTED_IMAGE: ghcr.io/${{ github.repository }}
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          $failures = [System.Collections.Generic.List[string]]::new()
          function Assert-That([bool] $Condition, [string] $Message) {
              if ($Condition) { Write-Host "ok   $Message" } else { Write-Host "FAIL $Message"; $failures.Add($Message) }
          }

          $semver = '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$'
          Assert-That ($env:CONTEXT_IMAGE -eq $env:EXPECTED_IMAGE.ToLowerInvariant()) "context image '$env:CONTEXT_IMAGE'"
          Assert-That ($env:CONTEXT_SHORT_SHA -eq $env:GITHUB_SHA.Substring(0, 7)) "context short-sha '$env:CONTEXT_SHORT_SHA'"
          Assert-That ($env:CONTEXT_IS_PULL_REQUEST -eq $env:IS_PULL_REQUEST) "context is-pull-request '$env:CONTEXT_IS_PULL_REQUEST'"
          if ($env:IS_PULL_REQUEST -eq 'true') {
              Assert-That ($env:CONTEXT_SHOULD_PUBLISH -eq 'false') 'pull requests are not published'
          }
          Assert-That ($env:TAG_VERSION -match $semver) "tag strategy '$env:TAG_VERSION'"
          Assert-That ($env:RUN_NUMBER_VERSION -match $semver) "run-number strategy '$env:RUN_NUMBER_VERSION'"
          if ($env:IS_TAG -ne 'true') {
              Assert-That ($env:TAG_VERSION -match '-') 'tag strategy is a prerelease outside tag builds'
              Assert-That ($env:MANIFEST_VERSION -like '2.3.4-*') "manifest strategy '$env:MANIFEST_VERSION'"
          }
          Assert-That ($env:ASSERT_CHECKED -eq 'true') "assert-tag-version checked '$env:ASSERT_CHECKED'"

          if ($failures.Count) { throw "$($failures.Count) check(s) failed." }
