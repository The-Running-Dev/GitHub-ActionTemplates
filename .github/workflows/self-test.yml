name: Self-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions: {}

concurrency:
  group: self-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pester:
    name: Pester (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Pester
        shell: pwsh
        run: ./scripts/Invoke-Tests.ps1

  actions:
    name: Actions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: debug
        uses: $/actions/debug

      - name: context
        id: context
        uses: $/actions/context

      - name: version (tag)
        id: tag
        uses: $/actions/version

      - name: version (run-number)
        id: run-number
        uses: $/actions/version
        with:
          strategy: run-number
          base-version: '1.0'

      # A tag build of this repository would not match the fixture version.
      - name: version (manifest)
        id: manifest
        if: github.ref_type != 'tag'
        uses: $/actions/version
        with:
          strategy: manifest
          working-directory: tests/fixtures/npm-lib

      - name: assert-tag-version
        id: assert
        uses: $/actions/assert-tag-version
        with:
          tag: v2.3.4
          manifest: tests/fixtures/npm-lib/package.json

      - name: Check outputs
        shell: pwsh
        env:
          CONTEXT_IMAGE: ${{ steps.context.outputs.image }}
          CONTEXT_SHORT_SHA: ${{ steps.context.outputs.short-sha }}
          CONTEXT_SHOULD_PUBLISH: ${{ steps.context.outputs.should-publish }}
          CONTEXT_IS_PULL_REQUEST: ${{ steps.context.outputs.is-pull-request }}
          TAG_VERSION: ${{ steps.tag.outputs.version }}
          RUN_NUMBER_VERSION: ${{ steps.run-number.outputs.version }}
          MANIFEST_VERSION: ${{ steps.manifest.outputs.version }}
          ASSERT_CHECKED: ${{ steps.assert.outputs.checked }}
          EXPECTED_IMAGE: ghcr.io/${{ github.repository }}
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: ./scripts/Test-ActionOutputs.ps1

  docs-template:
    name: Docs (template)
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: $/.github/workflows/docs.yml
    with:
      source: tests/fixtures/docusaurus
      deploy: false
      artifact-name: docs-template

  docs-node:
    name: Docs (node)
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: $/.github/workflows/docs.yml
    with:
      source: tests/fixtures/docs-node
      builder: node
      deploy: false
      artifact-name: docs-node

  docs-check:
    name: Docs artifacts
    needs: [docs-template, docs-node]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: docs-*
          path: artifacts

      - name: Check the sites
        shell: pwsh
        run: ./scripts/Test-DocsArtifacts.ps1

  node-ci:
    name: Node CI
    permissions:
      contents: read
    uses: $/.github/workflows/node-ci.yml
    with:
      working-directory: tests/fixtures/node-app
      os: '["ubuntu-latest", "windows-latest"]'
      scripts: lint test
      # Windows has Chrome installed outside PATH, Ubuntu on it.
      browser: true
      test-results: test-results/junit.xml
      coverage-reports: coverage/lcov.info
      minimum-coverage: '50'
      check-clean: true
      artifacts: |
        tests/fixtures/node-app/test-results/junit.xml
        tests/fixtures/node-app/coverage/lcov.info
      artifact-name: ci-node

  pwsh-ci:
    name: PowerShell CI
    permissions:
      contents: read
    uses: $/.github/workflows/pwsh-ci.yml
    with:
      os: '["ubuntu-latest", "windows-latest"]'
      paths: tests/fixtures/pwsh-module
      analyzer: true
      analyzer-settings: PSScriptAnalyzerSettings.psd1
      tests: tests/fixtures/pwsh-module/tests
      coverage: tests/fixtures/pwsh-module/Fixture.Module.psm1
      minimum-coverage: '80'
      artifact-name: ci-pester

  # The fixture's version cannot match a tag of this repository.
  npm-package:
    name: npm package
    if: github.ref_type != 'tag'
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: $/.github/workflows/npm-package.yml
    with:
      working-directory: tests/fixtures/npm-lib
      publish: false
      github-release: false
      artifact-name: ci-npm-package

  # Builds, tests and packs the fixture solution; publish is off. The fixture's version cannot
  # match a tag of this repository, so tag builds only test.
  dotnet:
    name: .NET
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: $/.github/workflows/dotnet.yml
    with:
      working-directory: tests/fixtures/dotnet-solution
      os: '["ubuntu-latest", "windows-latest"]'
      dotnet-version: 10.0.x
      test-filter: Category!=Slow
      coverage: true
      minimum-coverage: '60'
      artifact-name: ci-dotnet
      pack: ${{ github.ref_type != 'tag' }}
      package-artifact-name: ci-nupkg
      publish: false

  # The NuGet actions that dotnet.yml does not run in the self-test.
  dotnet-actions:
    name: .NET actions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: version (gitversion)
        id: gitversion
        uses: $/actions/version
        with:
          strategy: gitversion

      - name: nuget-feed
        id: feed
        uses: $/actions/nuget-feed
        with:
          sources: |
            github
            fixture=https://nuget.example.test/v3/index.json
          # Outside the fixture, so its restore does not read the fake feed.
          config-file: .selftest/nuget.config

      - name: dotnet-pack
        id: pack
        uses: $/actions/dotnet-pack
        with:
          working-directory: tests/fixtures/dotnet-solution
          version: 1.4.2-selftest.${{ github.run_number }}

      - name: nuget-push
        id: push
        uses: $/actions/nuget-push
        with:
          source: nuget.org
          dry-run: true

      - name: Check outputs
        shell: pwsh
        env:
          GITVERSION_VERSION: ${{ steps.gitversion.outputs.version }}
          FEED_CONFIG: ${{ steps.feed.outputs.config-file }}
          PACK_COUNT: ${{ steps.pack.outputs.count }}
          PACK_PACKAGES: ${{ steps.pack.outputs.packages }}
          PUSH_PUBLISHED: ${{ steps.push.outputs.published }}
          PUSH_COUNT: ${{ steps.push.outputs.count }}
          PUSH_SOURCE: ${{ steps.push.outputs.source }}
        run: ./scripts/Test-DotnetOutputs.ps1

  # Builds and smoke-tests the fixture image; push is off, so Publish and Deploy skip.
  container:
    name: Container
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: $/.github/workflows/container.yml
    with:
      context: tests/fixtures/container
      image-name: ghat-fixture
      build-args: FIXTURE_TEXT=from-build-arg
      push: false
      smoke-port: '8080'
      smoke-exec: tests/fixtures/container/smoke/in-container.sh
      smoke-scripts: tests/fixtures/container/smoke/Test-Fixture.ps1

  # The publish-side actions, against a local registry instead of GHCR.
  container-actions:
    name: Container actions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tests/fixtures/container
          build-args: FIXTURE_TEXT=from-build-arg
          tags: ghat-fixture:build
          load: true
          provenance: false

      - name: image-meta
        id: meta
        uses: $/actions/image-meta
        with:
          image: localhost:5000/ghat/fixture
          tags: short-sha sha

      - name: image-gate (start)
        id: gate
        uses: $/actions/image-gate
        with:
          image: ghat-fixture:build
          port: '8080'
          exec: tests/fixtures/container/smoke/in-container.sh

      - name: webhook-deploy
        id: deploy
        uses: $/actions/webhook-deploy
        with:
          url: ${{ steps.gate.outputs.url }}/
          method: GET
          health-url: ${{ steps.gate.outputs.url }}/version.txt
          health-expect: from-build-arg
          health-interval: '1'
          health-consecutive: '2'

      - name: image-gate (stop)
        if: always()
        uses: $/actions/image-gate
        with:
          mode: stop

      - name: image-archive (save)
        uses: $/actions/image-archive
        with:
          image: ghat-fixture:build
          path: ${{ runner.temp }}/ghat-image

      - name: image-archive (load)
        id: load
        uses: $/actions/image-archive
        with:
          mode: load
          path: ${{ runner.temp }}/ghat-image

      - name: image-push
        id: push
        uses: $/actions/image-push
        with:
          source: ${{ steps.load.outputs.image }}
          tags: ${{ steps.meta.outputs.tags }}

      - name: branch-tip-gate (all)
        id: tip-all
        uses: $/actions/branch-tip-gate
        with:
          sha: '0000000000000000000000000000000000000000'
          branch: main

      - name: branch-tip-gate (latest)
        id: tip-latest
        uses: $/actions/branch-tip-gate
        with:
          sha: '0000000000000000000000000000000000000000'
          branch: main
          require-tip: latest

      - name: Check outputs
        shell: pwsh
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
          GATE_URL: ${{ steps.gate.outputs.url }}
          WEBHOOK_STATUS: ${{ steps.deploy.outputs.webhook-status }}
          HEALTH_STATUS: ${{ steps.deploy.outputs.health-status }}
          LOADED_IMAGE: ${{ steps.load.outputs.image }}
          PUSH_IMAGE: ${{ steps.push.outputs.image }}
          PUSH_DIGEST: ${{ steps.push.outputs.digest }}
          TIP_ALL: ${{ toJSON(steps.tip-all.outputs) }}
          TIP_LATEST: ${{ toJSON(steps.tip-latest.outputs) }}
        run: ./scripts/Test-ContainerOutputs.ps1

  ci-check:
    name: CI artifacts
    needs: [node-ci, pwsh-ci, npm-package, dotnet]
    if: ${{ !cancelled() && needs.node-ci.result == 'success' && needs.pwsh-ci.result == 'success' && needs.npm-package.result != 'failure' && needs.dotnet.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-*
          path: artifacts

      - name: Check the artifacts
        shell: pwsh
        env:
          EXPECT_PACKAGE: ${{ needs.npm-package.result == 'success' }}
          EXPECT_NUGET_PACKAGE: ${{ github.ref_type != 'tag' }}
        run: ./scripts/Test-CiArtifacts.ps1 -ExpectPackage:($env:EXPECT_PACKAGE -eq 'true') -ExpectNuGetPackage:($env:EXPECT_NUGET_PACKAGE -eq 'true')
