name: Pages

# Builds a static site or single-page app with Node and deploys it to GitHub Pages from the
# default branch and tags. Pull requests and other branches only build. A final `Result` job
# gives branch protection one check to require.
#
# The caller grants `contents: read`, `pages: write` and `id-token: write`, and the repository's
# Pages source is set to "GitHub Actions". See docs/pages.md.

on:
  workflow_call:
    inputs:
      working-directory:
        description: Node project folder, relative to the repository root.
        type: string
        default: .
      node-version:
        description: Node version for actions/setup-node, in the build and for `post-deploy` scripts.
        type: string
        default: lts/*
      package-manager:
        description: '`npm`, `pnpm` or `yarn`. Empty detects it from the lockfile.'
        type: string
        default: ''
      setup:
        description: package.json scripts run with `npm run` before the install, separated by spaces.
        type: string
        default: ''
      scripts:
        description: package.json scripts that build the site, in order, separated by spaces. Empty skips the Node build (for a prebuilt `artifact`).
        type: string
        default: build
      dependencies:
        description: Local Node projects it depends on, one per line; each is installed and built first.
        type: string
        default: ''
      browser:
        description: Provide a system Chromium for scripts that need a browser (prerendering, tests).
        type: boolean
        default: false
      env:
        description: Build variables as `KEY=value`, one per line, exported to every later build step.
        type: string
        default: ''
      base-path:
        description: Path the site is served under, exported as PAGES_BASE_PATH. Empty reads it from the Pages settings (`/<repository>/` by default, `/` with a custom domain).
        type: string
        default: ''
      output:
        description: Built site folder, relative to `working-directory`.
        type: string
        default: dist
      spa:
        description: Single-page app; 404.html serves index.html so client-side routes load.
        type: boolean
        default: false
      pre-build:
        description: Repository scripts run before the install, by path from the repository root, one per line. `.ps1` files run in PowerShell.
        type: string
        default: ''
      post-build:
        description: Repository scripts run after the build, by path from the repository root, one per line.
        type: string
        default: ''
      artifact:
        description: Artifact from an earlier job of the calling workflow to download before the build and again before `post-deploy`, e.g. a prebuilt site. Empty downloads nothing.
        type: string
        default: ''
      artifact-path:
        description: Folder the `artifact` is downloaded into, relative to the repository root.
        type: string
        default: .
      deploy:
        description: Deploy to GitHub Pages from the default branch and tags. `false` only builds.
        type: boolean
        default: true
      require-tip:
        description: Skip the deployment when the commit is no longer the branch head, so an older run never replaces a newer site.
        type: boolean
        default: true
      post-deploy:
        description: Repository scripts run after the deployment, by path from the repository root, one per line. They get the site address as PAGES_URL, Node and the downloaded `artifact`.
        type: string
        default: ''
      cache:
        description: setup-node dependency cache, `npm`. Empty turns caching off.
        type: string
        default: ''
      cache-dependency-path:
        description: Lockfile(s) for the cache key, from the repository root. Needed when the project is not at the root.
        type: string
        default: ''
      runs-on:
        description: Runner label for the build job.
        type: string
        default: ubuntu-latest
      fetch-depth:
        description: Commits to fetch; 0 fetches all history.
        type: number
        default: 1
      submodules:
        description: '`true`, `recursive` or `false`, as for actions/checkout.'
        type: string
        default: 'false'
      artifact-name:
        description: Name of the Pages artifact.
        type: string
        default: github-pages
      timeout-minutes:
        description: Timeout of the build job.
        type: number
        default: 30
      utility-runs-on:
        description: Runner label for the Deploy and Result jobs.
        type: string
        default: ubuntu-latest
    secrets:
      BUILD_ENV:
        description: Secret build variables as `KEY=value`, one per line; each value is masked.
        required: false
    outputs:
      page-url:
        description: URL of the deployed site, empty when it was not deployed.
        value: ${{ jobs.deploy.outputs.page-url }}

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      pages: read
    outputs:
      should-publish: ${{ steps.context.outputs.should-publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          submodules: ${{ inputs.submodules }}
          persist-credentials: false

      - name: Context
        id: context
        uses: $/actions/context

      - name: Download
        if: inputs.artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: ${{ inputs.artifact-path }}

      - name: Pages environment
        uses: $/actions/pages-env
        with:
          base-path: ${{ inputs.base-path }}
          env: ${{ inputs.env }}
          secret-env: ${{ secrets.BUILD_ENV }}

      - name: Node
        if: inputs.scripts != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.cache }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
          package-manager-cache: false

      - name: Pre-build
        if: inputs.pre-build != ''
        uses: $/actions/run-scripts
        with:
          scripts: ${{ inputs.pre-build }}

      - name: Build
        if: inputs.scripts != ''
        uses: $/actions/node-scripts
        with:
          path: ${{ inputs.working-directory }}
          scripts: ${{ inputs.scripts }}
          setup: ${{ inputs.setup }}
          dependencies: ${{ inputs.dependencies }}
          package-manager: ${{ inputs.package-manager }}
          browser: ${{ inputs.browser }}

      - name: Post-build
        if: inputs.post-build != ''
        uses: $/actions/run-scripts
        with:
          scripts: ${{ inputs.post-build }}

      - name: Check site
        id: site
        uses: $/actions/pages-check
        with:
          path: ${{ inputs.output }}
          working-directory: ${{ inputs.working-directory }}
          spa: ${{ inputs.spa }}

      - name: Upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.site.outputs.path }}
          name: ${{ inputs.artifact-name }}

  deploy:
    name: Deploy
    needs: build
    if: inputs.deploy && needs.build.outputs.should-publish == 'true'
    runs-on: ${{ inputs.utility-runs-on }}
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # Not `pages` or `github-pages`: a caller's workflow-level group of that name would wait on itself.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    outputs:
      page-url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # The concurrency group orders deployments; the gate stops an older run that waited in it
      # from replacing what a newer one deployed.
      - name: Branch tip
        id: gate
        uses: $/actions/branch-tip-gate
        with:
          require-tip: ${{ inputs.require-tip && 'all' || 'none' }}

      - name: Deploy
        id: deploy
        if: steps.gate.outputs.publish == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ inputs.artifact-name }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.deploy.outcome == 'success' && inputs.post-deploy != ''
        with:
          submodules: ${{ inputs.submodules }}
          persist-credentials: false

      # Post-deploy scripts see what the build saw: the downloaded artifact and Node.
      - name: Download
        if: steps.deploy.outcome == 'success' && inputs.post-deploy != '' && inputs.artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: ${{ inputs.artifact-path }}

      - name: Node
        if: steps.deploy.outcome == 'success' && inputs.post-deploy != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false

      - name: Post-deploy
        if: steps.deploy.outcome == 'success' && inputs.post-deploy != ''
        uses: $/actions/run-scripts
        env:
          PAGES_URL: ${{ steps.deploy.outputs.page_url }}
        with:
          scripts: ${{ inputs.post-deploy }}

  result:
    name: Result
    needs: [build, deploy]
    if: always()
    runs-on: ${{ inputs.utility-runs-on }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: $/actions/needs-gate
        with:
          needs: ${{ toJSON(needs) }}
